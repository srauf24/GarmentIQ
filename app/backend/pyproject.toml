[project]
name = "garmentiq-backend"
version = "0.1.0"
description = "FastAPI backend for GarmentIQ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy==2.0.35",
    "psycopg[binary]>=3.1.0",
    "pydantic==2.9.0",
    "pydantic-settings==2.5.0",
    "anthropic==0.34.0",
    "python-multipart==0.0.9",
    "httpx==0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
]
